name: ${COMPOSE_PROJECT_NAME:-central-identity-production}

services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: central
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - production-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [production]
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: auth
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BIDDING_OIDC_CLIENT_ID: ${BIDDING_OIDC_CLIENT_ID:-}
      READING_OIDC_CLIENT_ID: ${READING_OIDC_CLIENT_ID:?READING_OIDC_CLIENT_ID is required}
      BIDDING_OIDC_REDIRECT_URI: ${BIDDING_OIDC_REDIRECT_URI:-}
      READING_OIDC_REDIRECT_URI: ${READING_OIDC_REDIRECT_URI:?READING_OIDC_REDIRECT_URI is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [production]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      NODE_ENV: production
      PORT: 3001
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/sign-in').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [production]
    restart: unless-stopped

  caddy:
    image: caddy:2.10.0-alpine
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      READING_DOMAIN: ${READING_DOMAIN:?READING_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - production-caddy-data:/data
      - production-caddy-config:/config
    depends_on:
      auth:
        condition: service_healthy
      web:
        condition: service_healthy
      reading-backend:
        condition: service_healthy
      reading-frontend:
        condition: service_healthy
    networks: [production]
    restart: unless-stopped

  reading-db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${READING_POSTGRES_DB:?READING_POSTGRES_DB is required}
      POSTGRES_USER: ${READING_POSTGRES_USER:?READING_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${READING_POSTGRES_PASSWORD:?READING_POSTGRES_PASSWORD is required}
    volumes:
      - reading-production-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [production]
    restart: unless-stopped

  reading-backend:
    build:
      context: ${READING_REPO_PATH:?Set READING_REPO_PATH to the Reading repo checkout}/backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${READING_DATABASE_URL:?READING_DATABASE_URL is required}
      BETTER_AUTH_URL: https://${READING_DOMAIN:?READING_DOMAIN is required}
      FRONTEND_URL: https://${READING_DOMAIN:?READING_DOMAIN is required}
      CORS_ORIGINS: https://${READING_DOMAIN:?READING_DOMAIN is required}
      AUTH_SECRET: ${READING_AUTH_SECRET:?READING_AUTH_SECRET is required}
      STRIPE_SECRET_KEY: ${READING_STRIPE_SECRET_KEY:?READING_STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${READING_STRIPE_WEBHOOK_SECRET:?READING_STRIPE_WEBHOOK_SECRET is required}
      CENTRAL_IDENTITY_ISSUER: https://${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      CENTRAL_IDENTITY_CLIENT_ID: ${READING_OIDC_CLIENT_ID:?READING_OIDC_CLIENT_ID is required}
      CENTRAL_IDENTITY_CLIENT_SECRET: ${READING_OIDC_CLIENT_SECRET:?READING_OIDC_CLIENT_SECRET is required}
    depends_on:
      reading-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [production]
    restart: unless-stopped

  reading-frontend:
    build:
      context: ${READING_REPO_PATH:?Set READING_REPO_PATH to the Reading repo checkout}/frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: https://${READING_DOMAIN:?READING_DOMAIN is required}
        NUXT_PUBLIC_BACKEND_URL: https://${READING_DOMAIN:?READING_DOMAIN is required}
        NUXT_PUBLIC_CENTRAL_IDENTITY_URL: https://${AUTH_DOMAIN:?AUTH_DOMAIN is required}
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_SITE_URL: https://${READING_DOMAIN:?READING_DOMAIN is required}
      NUXT_PUBLIC_BACKEND_URL: https://${READING_DOMAIN:?READING_DOMAIN is required}
      NUXT_PUBLIC_CENTRAL_IDENTITY_URL: https://${AUTH_DOMAIN:?AUTH_DOMAIN is required}
    depends_on:
      reading-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [production]
    restart: unless-stopped

networks:
  production:
    name: central-identity-production

volumes:
  production-db:
  reading-production-db:
    name: ${READING_DB_VOLUME:?Set READING_DB_VOLUME to the verified existing Reading database volume}
    external: true
  production-caddy-data:
  production-caddy-config:
