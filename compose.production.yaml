name: central-identity-production

services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: central
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - production-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: auth
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BIDDING_OIDC_CLIENT_ID: ${BIDDING_OIDC_CLIENT_ID:-}
      READING_OIDC_CLIENT_ID: ${READING_OIDC_CLIENT_ID:-}
      BIDDING_OIDC_REDIRECT_URI: ${BIDDING_OIDC_REDIRECT_URI:-}
      READING_OIDC_REDIRECT_URI: ${READING_OIDC_REDIRECT_URI:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      NODE_ENV: production
      PORT: 3001
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/sign-in').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  caddy:
    image: caddy:2.10.0-alpine
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - production-caddy-data:/data
      - production-caddy-config:/config
    depends_on:
      auth:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  production-db:
  production-caddy-data:
  production-caddy-config:
