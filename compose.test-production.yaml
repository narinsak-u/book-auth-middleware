services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set isolated test-production POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set isolated test-production POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set isolated test-production POSTGRES_PASSWORD}

  mailpit:
    ports: !override
      - "127.0.0.1:8026:8025"

  auth:
    environment:
      NODE_ENV: production
      TEST_PRODUCTION: "true"
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set test-production AUTH_DOMAIN}
      DATABASE_URL: ${DATABASE_URL:?Set isolated test-production DATABASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set test-production BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set test-production BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set separate test-production Google client ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set test-production Google client secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set separate test-production GitHub client ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set test-production GitHub client secret}
      BIDDING_OIDC_CLIENT_ID: ${BIDDING_OIDC_CLIENT_ID:?Set test-production Bidding client ID}
      READING_OIDC_CLIENT_ID: ${READING_OIDC_CLIENT_ID:?Set test-production Reading client ID}

  web:
    environment:
      NODE_ENV: production
      TEST_PRODUCTION: "true"

  caddy:
    ports: !override
      - "127.0.0.1:8081:8081"
    volumes:
      - ./infrastructure/Caddyfile.test-production:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:${DEV_HOST_IP:-host-gateway}"
